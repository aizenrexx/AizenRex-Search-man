name: Build and Release

# Tag a commit (e.g. `git tag v0.3.9 && git push origin v0.3.9`) and GitHub builds,
# tests, packages and publishes the release entirely in the cloud — no local PC needed.
# Can also be run manually from the Actions tab (Run workflow).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.3.9)'
        required: true
        default: '0.3.9'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^[vV]', ''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version '$v' — expected something like 0.3.9" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building AizenRex Search-man v$v"

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ensure application icons
        shell: powershell
        run: |
          $icon = "src/AizenSearch.App/AizenRex.ico"
          if (-not (Test-Path $icon)) {
            Write-Host "Icon missing - generating it."
            ./scripts/generate_ico.ps1 -OutputPath $icon
          }
          Get-Item $icon | Format-List Name, Length

      - name: Restore
        run: dotnet restore AizenSearch.sln

      - name: Build
        run: dotnet build AizenSearch.sln -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Run tests
        run: dotnet test AizenSearch.sln -c Release --no-build --verbosity normal

      - name: Publish portable build
        run: >
          dotnet publish src/AizenSearch.App/AizenSearch.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0
          -p:FileVersion=${{ steps.ver.outputs.version }}.0
          -o Distribution/Portable

      - name: Verify version is consistent everywhere
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $src = Get-Content "src/AizenSearch.Core/Services/UpdateService.cs" -Raw
          $m = [regex]::Match($src, 'CurrentVersion\s*=\s*"([0-9.]+)"')
          $cur = if ($m.Success) { $m.Groups[1].Value } else { '(not found)' }
          if ($cur -ne $ver) {
            throw "Version mismatch: UpdateService.CurrentVersion is $cur but this release is $ver. Bump the constant in src/AizenSearch.Core/Services/UpdateService.cs so installed copies can see this update."
          } else {
            Write-Host "UpdateService.CurrentVersion matches $ver."
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "Distribution/Portable/*" `
            -DestinationPath "Distribution/AizenRex-Search-man-v$ver-Portable.zip" -Force
          Get-Item "Distribution/AizenRex-Search-man-v$ver-Portable.zip" | Format-List Name, Length

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          AIZEN_SOURCE_ROOT: ${{ github.workspace }}
          AIZEN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "aizen_search_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }

      - name: Sign installer (only when a certificate is configured)
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $setup = "Distribution/Installer/AizenRex-Search-man-Setup-v${{ steps.ver.outputs.version }}.exe"
          if (-not $env:CERT_PFX_BASE64) {
            Write-Host "No code-signing certificate configured - the installer will be published unsigned."
            Write-Host "Windows SmartScreen will show an 'unrecognized app' prompt until the download builds reputation."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found on the runner" }
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
          if ($LASTEXITCODE -ne 0) { throw "Signing failed with exit code $LASTEXITCODE" }
          Remove-Item $pfx -Force
          Write-Host "Signed $setup"
          & $signtool verify /pa $setup

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AizenRex-Search-man-v${{ steps.ver.outputs.version }}
          path: |
            Distribution/AizenRex-Search-man-v${{ steps.ver.outputs.version }}-Portable.zip
            Distribution/Installer/AizenRex-Search-man-Setup-v${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME } else { $tag = "v$ver" }
          $setup = "Distribution/Installer/AizenRex-Search-man-Setup-v$ver.exe"
          $zip   = "Distribution/AizenRex-Search-man-v$ver-Portable.zip"
          foreach ($f in @($setup, $zip)) { if (-not (Test-Path $f)) { throw "Missing release asset: $f" } }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $zip --clobber
          } else {
            gh release create $tag $setup $zip --title "AizenRex Search-man v$ver" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publish failed" }
          Write-Host "Released $tag"
