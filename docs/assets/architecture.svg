      <path d="M1,1 L9,5.5 L1,10" fill="none" stroke="#52E8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs><rect width="1240" height="760" fill="url(#abg)"/><text x="48" y="54" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="-0.6" opacity="1">Architecture</text><text x="48" y="82" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">Three projects. The engine has no UI dependency, so everything expensive stays testable.</text><rect x="40" y="104" width="1160" height="208" rx="16" fill="#0f1a2c" stroke="#1e3350" stroke-width="1.6"/><rect x="40" y="104" width="1160" height="42" rx="16" fill="url(#acyan)" opacity="0.13"/><text x="64" y="131" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#52E8FF" text-anchor="start" letter-spacing="0" opacity="1">AizenSearch.App</text><text x="212" y="131" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="14" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">WPF shell hosting WebView2</text><rect x="64" y="158" width="150" height="132" rx="12" fill="#101c30" stroke="#24405f" stroke-width="1.4"/><text x="82" y="187" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="0" opacity="1">Views/MainWindow</text><text x="82" y="212" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">Hosts the WebView2 control, maps</text><text x="82" y="231" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">Web/ to a virtual host, and sets</text><text x="82" y="250" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">the window title from the version</text><text x="82" y="269" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">constant.</text><rect x="416" y="158" width="150" height="132" rx="12" fill="#101c30" stroke="#24405f" stroke-width="1.4"/><text x="434" y="187" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="0" opacity="1">Ipc/IpcBridge</text><text x="434" y="212" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">The bridge. Receives JSON from the</text><text x="434" y="231" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">interface, dispatches to core</text><text x="434" y="250" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">services, pushes results back.</text><rect x="768" y="158" width="150" height="132" rx="12" fill="#101c30" stroke="#24405f" stroke-width="1.4"/><text x="786" y="187" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="0" opacity="1">Web/  ·  the interface</text><text x="786" y="212" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">index.html · app.js ·</text><text x="786" y="231" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">virtual-scroll.js · preview.js ·</text><text x="786" y="250" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">app.css — no framework, no build</text><text x="786" y="269" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">step.</text><line x1="218" y1="224" x2="410" y2="224" stroke="#3b5f8a" stroke-width="2" marker-end="url(#aarr)"/><line x1="570" y1="224" x2="762" y2="224" stroke="#3b5f8a" stroke-width="2" marker-end="url(#aarr)"/><text x="314" y="214" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#93a7c0" text-anchor="middle" letter-spacing="0" opacity="1">JSON messages</text><rect x="40" y="340" width="1160" height="52" rx="12" fill="#0f2036" stroke="#2a3f63" stroke-width="1.4"/><text x="62" y="372" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#A66BFF" text-anchor="start" letter-spacing="0" opacity="1">IPC</text><text x="120" y="372" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">WebView2 postMessage  ·  { action: "search" | "preview" | "open" | "export_csv" | … }  ·  results pushed back as JSON</text><rect x="40" y="424" width="1160" height="292" rx="16" fill="#0f1a2c" stroke="#1e3350" stroke-width="1.6"/><rect x="40" y="424" width="1160" height="42" rx="16" fill="url(#aviolet)" opacity="0.13"/><text x="64" y="451" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#A66BFF" text-anchor="start" letter-spacing="0" opacity="1">AizenSearch.Core</text><text x="224" y="451" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="14" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">the engine — no UI dependency</text><rect x="64" y="478" width="254" height="218" rx="12" fill="#101c30" stroke="#24405f" stroke-width="1.4"/><rect x="64" y="478" width="254" height="3" rx="1.5" fill="#52E8FF" opacity="0.85"/><text x="80" y="508" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#52E8FF" text-anchor="start" letter-spacing="0" opacity="1">Indexing</text><text x="80" y="534.0" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  IndexManager</text><text x="80" y="553.5" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  NtfsMftIndexer</text><text x="80" y="573.0" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  ParallelDirectoryIndexer</text><text x="80" y="592.5" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  RealtimeIndexWatcher</text><text x="80" y="612.0" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  ConnectedLibrarySeeder</text><rect x="330" y="478" width="254" height="218" rx="12" fill="#101c30" stroke="#24405f" stroke-width="1.4"/><rect x="330" y="478" width="254" height="3" rx="1.5" fill="#A66BFF" opacity="0.85"/><text x="346" y="508" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#A66BFF" text-anchor="start" letter-spacing="0" opacity="1">Search</text><text x="346" y="534.0" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  QueryParser</text><text x="346" y="553.5" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  SearchEngine</text><text x="346" y="573.0" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  RelevanceRanker</text><rect x="596" y="478" width="254" height="218" rx="12" fill="#101c30" stroke="#24405f" stroke-width="1.4"/><rect x="596" y="478" width="254" height="3" rx="1.5" fill="#FFD338" opacity="0.85"/><text x="612" y="508" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#FFD338" text-anchor="start" letter-spacing="0" opacity="1">Storage</text><text x="612" y="534.0" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  BinaryCacheService</text><text x="612" y="553.5" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12.5" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">·  DirectoryPool</text><rect x="862" y=