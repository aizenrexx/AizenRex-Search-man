<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-label="AizenRex Search-man architecture"><defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c16"/><stop offset="0.5" stop-color="#0d1628"/><stop offset="1" stop-color="#121e36"/>
    </linearGradient>
    <linearGradient id="acyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52E8FF"/><stop offset="1" stop-color="#0879FF"/></linearGradient>
    <linearGradient id="aviolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A66BFF"/><stop offset="1" stop-color="#5520E8"/></linearGradient>
