or="start" letter-spacing="0" opacity="1">·  LogService</text><line x1="620" y1="314" x2="620" y2="338" stroke="#52E8FF" stroke-width="2.2" marker-end="url(#aarrc)"/><rect x="64" y="566" width="310" height="86" rx="12" fill="#0f2036" stroke="#2a3f63" stroke-width="1.4"/><text x="80" y="594" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="700" fill="#52E8FF" text-anchor="start" letter-spacing="0" opacity="1">NTFS volume</text><text x="80" y="618" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">MFT / USN Journal via</text><text x="80" y="636" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">FSCTL_ENUM_USN_DATA</text><line x1="374" y1="609" x2="592" y2="609" stroke="#3b5f8a" stroke-width="2" marker-end="url(#aarr)" stroke-dasharray="5 4"/><rect x="596" y="566" width="254" height="86" rx="12" fill="#0f2036" stroke="#2a3f63" stroke-width="1.4"/><text x="612" y="594" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="700" fill="#FFD338" text-anchor="start" letter-spacing="0" opacity="1">index.bin</text><text x="612" y="618" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="11.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">%LOCALAPPDATA%\AizenSearch</text><text x="612" y="636" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">atomic write · ms reload</text><line x1="850" y1="609" x2="860" y2="609" stroke="#3b5f8a" stroke-width="2"/><rect x="862" y="566" width="310" height="86" rx="12" fill="#0f2036" stroke="#2a3f63" stroke-width="1.4"/><text x="878" y="594" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="700" fill="#4ade80" text-anchor="start" letter-spacing="0" opacity="1">GitHub Releases</text><text x="878" y="618" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">one HTTPS call, on launch</text><text x="878" y="636" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">/releases/latest</text><text x="48" y="748" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="0.9">Assemblies, namespaces, the cache folder and the executable keep their original AizenSearch identifiers on purpose — renaming them would orphan existing installs and saved indexes.</text></svg>