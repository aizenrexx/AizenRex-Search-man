<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-label="How a search flows through AizenRex Search-man"><defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c16"/><stop offset="0.5" stop-color="#0d1628"/><stop offset="1" stop-color="#121e36"/>
    </linearGradient>
    <marker id="sarr" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto">
      <path d="M1,1 L9,5.5 L1,10" fill="none" stroke="#3b5f8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs><rect width="1240" height="560" fill="url(#sbg)"/><text x="48" y="54" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="-0.6" opacity="1">How a search flows</text><text x="48" y="82" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">From keystroke to painted row — six steps, no disk access after the index is warm.</text><rect x="48" y="118" width="350" height="120" rx="14" fill="#101c30" stroke="#24405f" stroke-width="1.5"/><rect x="48" y="118" width="4" height="120" rx="2" fill="#52E8FF"/><circle cx="88" cy="160" r="20" fill="#52E8FF" opacity="0.16"/><text x="88" y="166" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#52E8FF" text-anchor="middle" letter-spacing="0" opacity="1">01</text><text x="120" y="158" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="0" opacity="1">You type</text><text x="120" y="184" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">app.js posts { action: "search" }</text><text x="120" y="203" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">over the WebView2 bridge</text><line x1="406" y1="178.0" x2="444" y2="178.0" stroke="#3b5f8a" stroke-width="2" marker-end="url(#sarr)"/><rect x="445" y="118" width="350" height="120" rx="14" fill="#101c30" stroke="#24405f" stroke-width="1.5"/><rect x="445" y="118" width="4" height="120" rx="2" fill="#A66BFF"/><circle cx="485" cy="160" r="20" fill="#A66BFF" opacity="0.16"/><text x="485" y="166" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#A66BFF" text-anchor="middle" letter-spacing="0" opacity="1">02</text><text x="517" y="158" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="0" opacity="1">Query parsed</text><text x="517" y="184" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">QueryParser reads ext:, type:,</text><text x="517" y="203" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">size:, date:, !exclude, regex</text><line x1="803" y1="178.0" x2="841" y2="178.0" stroke="#3b5f8a" stroke-width="2" marker-end="url(#sarr)"/><rect x="842" y="118" width="350" height="120" rx="14" fill="#101c30" stroke="#24405f" stroke-width="1.5"/><rect x="842" y="118" width="4" height="120" rx="2" fill="#0879FF"/><circle cx="882" cy="160" r="20" fill="#0879FF" opacity="0.16"/><text x="882" y="166" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#0879FF" text-anchor="middle" letter-spacing="0" opacity="1">03</text><text x="914" y="158" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="0" opacity="1">Index searched</text><text x="914" y="184" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">SearchEngine runs the query</text><text x="914" y="203" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">against the in-memory index</text><path d="M1017.0,244 V270 H223.0 V294" fill="none" stroke="#3b5f8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#sarr)"/><rect x="48" y="300" width="350" height="120" rx="14" fill="#101c30" stroke="#24405f" stroke-width="1.5"/><rect x="48" y="300" width="4" height="120" rx="2" fill="#FFD338"/><circle cx="88" cy="342" r="20" fill="#FFD338" opacity="0.16"/><text x="88" y="348" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#FFD338" text-anchor="middle" letter-spacing="0" opacity="1">04</text><text x="120" y="340" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="0" opacity="1">Results ranked</text><text x="120" y="366" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">RelevanceRanker orders: exact name</text><text x="120" y="385" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">first, path matches last</text><line x1="406" y1="360.0" x2="444" y2="360.0" stroke="#3b5f8a" stroke-width="2" marker-end="url(#sarr)"/><rect x="445" y="300" width="350" height="120" rx="14" fill="#101c30" stroke="#24405f" stroke-width="1.5"/><rect x="445" y="300" width="4" height="120" rx="2" fill="#ff7ac6"/><circle cx="485" cy="342" r="20" fill="#ff7ac6" opacity="0.16"/><text x="485" y="348" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#ff7ac6" text-anchor="middle" letter-spacing="0" opacity="1">05</text><text x="517" y="340" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="0" opacity="1">Rows returned</text><text x="517" y="366" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">IpcBridge pushes JSON back</text><text x="517" y="385" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">with PostWebMessageAsJson</text><line x1="803" y1="360.0" x2="841" y2="360.0" stroke="#3b5f8a" stroke-width="2" marker-end="url(#sarr)"/><rect x="842" y="300" width="350" height="120" rx="14" fill="#101c30" stroke="#24405f" stroke-width="1.5"/><rect x="842" y="300" width="4" height="120" rx="2" fill="#4ade80"/><circle cx="882" cy="342" r="20" fill="#4ade80" opacity="0.16"/><text x="882" y="348" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="0" opacity="1">06</text><text x="914" y="340" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="700" fill="#eaf2ff" text-anchor="start" letter-spacing="0" opacity="1">Only visible rows draw</text><text x="914" y="366" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">virtual-scroll.js renders what is</text><text x="914" y="385" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#93a7c0" text-anchor="start" letter-spacing="0" opacity="1">on screen — 100k results stay smooth</text><rect x="48" y="452" width="1144" height="64" rx="12" fill="#0f2036" stroke="#2a3f63" stroke-width="1.4"/><text x="70" y="480" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="700" fill="#52E8FF" text-anchor="start" letter-spacing="0" opacity="1">Cold start</text><text x="150" y="480" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">index.bin is read and deserialised — milliseconds for millions of entries, because directory strings are interned, not duplicated.</text><text x="70" y="504" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="700" fill="#FFD338" text-anchor="start" letter-spacing="0" opacity="1">Warm search</text><text x="158" y="504" font-family="'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#b9c9dd" text-anchor="start" letter-spacing="0" opacity="1">every step above runs in memory. The disk is touched only when the filesystem watcher reports a change.</text></svg>